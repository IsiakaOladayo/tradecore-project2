name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '*/*.tf'
      - '*.tf'
      - '.github/workflows/**'
      - '.terraform.lock.hcl'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '*/*.tf'
      - '*.tf'
      - '.github/workflows/**'
      - '.terraform.lock.hcl'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serializes runs per ref; the state lock allows only one writer.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_DIR: terraform
  AWS_REGION: af-south-1

jobs:
  # Fails fast before any real work.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required secrets are non-empty
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CONTAINER_IMAGE: ${{ secrets.CONTAINER_IMAGE }}
          ORG_GITHUB_ID: ${{ secrets.ORG_GITHUB_ID }}
          REPO_GITHUB_ID: ${{ secrets.REPO_GITHUB_ID }}
        run: |
          set -euo pipefail
          required="AWS_ROLE_ARN TF_STATE_BUCKET TF_STATE_KEY TF_LOCK_TABLE DB_NAME DB_USERNAME DB_PASSWORD JWT_SECRET CONTAINER_IMAGE ORG_GITHUB_ID REPO_GITHUB_ID"
          missing=""
          count=0
          for name in $required; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
              count=$((count + 1))
            fi
          done
          if [ "$count" -ne 0 ]; then
            echo "::error::Missing or empty required secrets:$missing"
            echo "Without these Terraform substitutes an empty string and silently corrupts state."
            exit 1
          fi
          echo "All 11 required secrets present."

  scan:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Blocking: hardcoded credentials must never land.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: table

      # Misconfig scan is a blocking gate; exceptions live in .trivyignore.
      - name: Trivy misconfiguration scan (blocking)
        id: trivy-misconfig
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: table

  terraform:
    name: Terraform
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Recursive: module dirs outside terraform/ must be covered too.
      - name: Terraform Format Check (recursive)
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      # Empty aws_profile selects the OIDC chain (no shared profile on runners).
      # Org/repo come from the run context (GITHUB_* can't be secrets); secrets
      # travel as TF_VAR_* env, never CLI args.
      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_container_image: ${{ secrets.CONTAINER_IMAGE }}
          TF_VAR_github_org_id: ${{ secrets.ORG_GITHUB_ID }}
          TF_VAR_github_repo_id: ${{ secrets.REPO_GITHUB_ID }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_environment: production
          TF_VAR_aws_profile: ''
          OPT_CERT_ARN: ${{ secrets.CERTIFICATE_ARN }}
          OPT_DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euo pipefail
          args=(plan -input=false -out=tfplan)
          # CERTIFICATE_ARN / DOMAIN_NAME stay optional until HTTPS is
          # provisioned; absent secrets stay null instead of becoming "".
          if [ -n "${OPT_CERT_ARN:-}" ]; then
            args+=(-var="certificate_arn=${OPT_CERT_ARN}")
          fi
          if [ -n "${OPT_DOMAIN:-}" ]; then
            args+=(-var="domain_name=${OPT_DOMAIN}")
          fi
          terraform "${args[@]}" 2>&1 | tee plan.txt
        working-directory: ${{ env.TF_DIR }}

      - name: Publish plan summary
        if: always()
        run: |
          if [ -f plan.txt ]; then
            {
              echo '### Terraform plan'
              echo '```'
              tail -c 60000 plan.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}

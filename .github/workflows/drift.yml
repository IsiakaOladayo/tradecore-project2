name: Drift detection

on:
  schedule:
    # Daily 06:00 UTC, read-only. Fails when live infra drifts from main.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize with Terraform runs; the state lock allows only one reader/writer.
concurrency:
  group: terraform-refs/heads/main
  cancel-in-progress: false

env:
  TF_DIR: terraform
  AWS_REGION: af-south-1

jobs:
  drift:
    name: Drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
        working-directory: ${{ env.TF_DIR }}

      # Real secrets (not dummies): secret versions carry values, so dummy
      # vars would report phantom drift on every run.
      - name: Terraform Plan (detect drift)
        id: plan
        env:
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_container_image: ${{ secrets.CONTAINER_IMAGE }}
          TF_VAR_github_org_id: ${{ secrets.ORG_GITHUB_ID }}
          TF_VAR_github_repo_id: ${{ secrets.REPO_GITHUB_ID }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_environment: production
          TF_VAR_aws_profile: ''
          OPT_CERT_ARN: ${{ secrets.CERTIFICATE_ARN }}
          OPT_DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euo pipefail
          args=(plan -input=false -detailed-exitcode)
          if [ -n "${OPT_CERT_ARN:-}" ]; then
            args+=(-var="certificate_arn=${OPT_CERT_ARN}")
          fi
          if [ -n "${OPT_DOMAIN:-}" ]; then
            args+=(-var="domain_name=${OPT_DOMAIN}")
          fi
          set +e
          terraform "${args[@]}" 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::Drift detected — live infra differs from main. Inspect the plan, then reconcile via a normal Terraform run."
            exit 1
          fi
          exit "$code"
        working-directory: ${{ env.TF_DIR }}
